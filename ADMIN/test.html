<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hiển thị hình ảnh trong input file</title>
    <style>
      .img-element-them {
        width: 100px;
        height: 100px;
        border-radius: 40px;
      }

      .file-img-them {
        width: 100px;
        height: 100px;
        margin-top: -100px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <label for="image-uploadvcl">
      <img
        src="https://tse4.mm.bing.net/th?id=OIP.bwUaQIgXMhBg_SbC-k8MuwHaFV&pid=Api&P=0&h=180"
        alt="Image"
        class="img-element-them"
      />
    </label>
    <input
      id="image-uploadvcl"
      type="file"
      style="display: none"
      class="file-img-them"
    />
    <script>
      const inputFile = document.getElementsByClassName("file-img-them")[0];
      const img = document.getElementsByClassName("img-element-them")[0];
      const defaultImage =
        "https://tse4.mm.bing.net/th?id=OIP.bwUaQIgXMhBg_SbC-k8MuwHaFV&pid=Api&P=0&h=180";
      img.src = defaultImage;
      inputFile.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) {
          img.src = URL.createObjectURL(file);
          img.classList.add("sua-img-them");
          inputFile.classList.add("file-img-them");
        } else {
          img.src = defaultImage;
          img.classList.remove("sua-img-them");
          inputFile.classList.remove("file-img-them");
        }
      });
    </script>
  </body>
</html>
